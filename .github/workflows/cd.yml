      # - run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      #
      # AWS:
      # - uses: aws-actions/configure-aws-credentials@v4
      #   ...

      - name: Deploy (not yet configured)
        run: echo "Deployment target not configured. Set up in CD when platform is chosen."
